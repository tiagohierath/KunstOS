# KunstOS lock screen: the painting, a big clock, the date and a square password box
animations {
    enabled = false
}

background {
    path = /etc/kunstos/wallpaper.jpg
}

label {
    text = $TIME12
    font_family = PxPlus ToshibaSat 9x16
    font_size = 96
    color = rgb(ebdbb2)
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A %-d %B"
    font_family = PxPlus ToshibaSat 9x16
    font_size = 48
    color = rgb(ebdbb2)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 400, 56
    rounding = 0
    outline_thickness = 1
    outer_color = rgb(83a598)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    font_family = PxPlus ToshibaSat 9x16
    check_color = rgb(fabd2f)
    fail_color = rgb(fb4934)
    placeholder_text =
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
